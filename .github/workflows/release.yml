name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump version numbers
        id: bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          OLD_VER=$(jq -r '.version' src-tauri/tauri.conf.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VER"
          NEW_PATCH=$((PATCH + 1))
          NEW_VER="${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "Bumping version from $OLD_VER to $NEW_VER"

          jq --arg ver "$NEW_VER" '.version = $ver' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp && mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json
          sed -i "s/^version = \"$OLD_VER\"/version = \"$NEW_VER\"/" src-tauri/Cargo.toml

          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml

          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(release): bump version to $NEW_VER [skip ci]"
            git push origin main
          fi

          echo "version=v$NEW_VER" >> "$GITHUB_OUTPUT"

  build:
    needs: bump

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-22.04

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull version bump commit
        shell: bash
        run: git pull origin main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-cache: true

      - run: bun install --frozen-lockfile

      - if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Build & Publish Release Assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.bump.outputs.version }}
          releaseName: ${{ needs.bump.outputs.version }}
          generateReleaseNotes: true
          uploadUpdaterJson: false
          releaseDraft: false
          prerelease: false
          includeAppImage: true
          includeDeb: true
          includeRpm: true
          includeDmg: true
          includeMsi: true
          includeExe: true
